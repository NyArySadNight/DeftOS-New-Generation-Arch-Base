name: Lint installer

on:
  push:
    paths: ["installer/**", ".github/workflows/installer-lint.yml"]
  pull_request:
    paths: ["installer/**"]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck installer/bin/deftinstall
      - name: JSON
        run: python3 -m json.tool installer/archinstall.json >/dev/null && echo "json ok"
