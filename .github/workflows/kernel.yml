name: Build DeftOS kernel (Arch)

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths: ["kernel/**", ".github/workflows/kernel.yml"]
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync upstream and build
        run: |
          docker run --privileged --rm -v "$PWD:/src" -w /src archlinux:latest bash -c "
            pacman -Syu --noconfirm base-devel git bc cpio gettext libelf pahole perl python python-yaml tar xz zstd openssl &&
            useradd -m builder && chown -R builder /src &&
            su builder -c 'cd /src && bash kernel/sync-build.sh'
          "

      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: deftos-kernel-pkgs
          path: kernel/out/*.pkg.tar.zst
          retention-days: 7

      - name: Publish pacman repo (release kernel-latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFTOS_GPG_KEY: ${{ secrets.DEFTOS_GPG_KEY_B64 }}
        run: |
          cd kernel/out
          printf '%s' "$DEFTOS_GPG_KEY" | base64 -d > "$RUNNER_TEMP/deftos.key"
          docker run --rm -v "$PWD:/out" -v "$RUNNER_TEMP/deftos.key:/key.asc:ro" -w /out archlinux:latest bash -c "
            pacman -Sy --noconfirm gnupg pacman-contrib >/dev/null &&
            export GNUPGHOME=/tmp/gpg && mkdir -m700 \$GNUPGHOME &&
            gpg --batch --import /key.asc &&
            KID=\$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print \$10; exit}') &&
            for p in *.pkg.tar.zst; do gpg --batch --yes --detach-sign --no-armor -u \$KID \"\$p\"; done &&
            repo-add --sign --key \$KID deftos.db.tar.gz *.pkg.tar.zst
          "
          rm -f "$RUNNER_TEMP/deftos.key"
          gh release view kernel-latest >/dev/null 2>&1 || gh release create kernel-latest --title "DeftOS kernel repo" --notes "Auto-built linux-deftos packages" --prerelease
          gh release upload kernel-latest --clobber *.pkg.tar.zst *.pkg.tar.zst.sig deftos.db.tar.gz deftos.db.tar.gz.sig deftos.files.tar.gz deftos.files.tar.gz.sig
          rm -f deftos.db deftos.files
